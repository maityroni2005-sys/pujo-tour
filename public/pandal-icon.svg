<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="utsavGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C8102E" />
      <stop offset="50%" stop-color="#9B1B30" />
      <stop offset="100%" stop-color="#580C1F" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#9B1B30" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Outer Shield / Halo -->
  <circle cx="50" cy="50" r="46" fill="url(#utsavGrad)" stroke="url(#goldGrad)" stroke-width="3" />
  <circle cx="50" cy="50" r="40" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="2,3" />

  <!-- Trinetra / Third Eye Motif & Bengali Trishul Accent -->
  <path d="M 50 16 C 53 28, 62 33, 62 40 C 62 47, 54 53, 50 63 C 46 53, 38 47, 38 40 C 38 33, 47 28, 50 16 Z" fill="url(#goldGrad)"/>
  <circle cx="50" cy="40" r="4.5" fill="#800020" />
  <circle cx="50" cy="40" r="2.2" fill="#FFE066" />

  <!-- Left Lotus Eye -->
  <path d="M 22 46 C 28 42, 38 43, 43 51 C 38 56, 28 56, 22 46 Z" fill="#FDFBF7" stroke="#F59E0B" stroke-width="1.2"/>
  <circle cx="33" cy="49" r="3.2" fill="#121217" />
  <circle cx="34" cy="48" r="1.2" fill="#FFFFFF" />

  <!-- Right Lotus Eye -->
  <path d="M 78 46 C 72 42, 62 43, 57 51 C 62 56, 72 56, 78 46 Z" fill="#FDFBF7" stroke="#F59E0B" stroke-width="1.2"/>
  <circle cx="67" cy="49" r="3.2" fill="#121217" />
  <circle cx="66" cy="48" r="1.2" fill="#FFFFFF" />

  <!-- Base Tilak & Dhunachi Arch -->
  <path d="M 45 68 Q 50 64 55 68 Q 50 78 45 68 Z" fill="url(#goldGrad)"/>
  <path d="M 32 75 C 42 71, 58 71, 68 75 C 59 83, 41 83, 32 75 Z" fill="#C8102E" stroke="#F59E0B" stroke-width="1.5"/>
</svg>
